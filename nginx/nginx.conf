worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 80;
    server_name download.anubis.locker update.anubis.locker;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Access-Control-Allow-Origin * always;

    location = /version.html {
      default_type text/html;
      add_header Cache-Control "public,max-age=300" always;
      add_header Access-Control-Allow-Origin * always;
    }

    # With ?src= the Node filter service answers; otherwise the file is served as-is.
    location = /data/anubis-release.json {
      default_type application/json;
      add_header Cache-Control "public,max-age=300" always;
      add_header Access-Control-Allow-Origin * always;
      if ($arg_src != "") {
        proxy_pass http://filter:3001;
      }
    }

    location /scripts/ {
      default_type text/plain;
    }

    location / {
      try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
  }
}
