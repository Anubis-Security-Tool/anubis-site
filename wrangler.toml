# Cloudflare alternative to nginx + filter service. Deploy manually: `npx wrangler deploy`
# after `npm run build`. Not deployed by any script here.
name = "anubis-site"
main = "worker/worker.js"
compatibility_date = "2026-06-30"

[[routes]]
pattern = "download.anubis.locker"
custom_domain = true

[[routes]]
pattern = "update.anubis.locker"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Worker-first only for the release JSON so ?src= can be read; the rest stays asset-first.
run_worker_first = ["/data/anubis-release.json"]
